spring:
  application:
    name: short-link
  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: 初始数据库基线
    validate-on-migrate: true
    clean-disabled: true

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 3000ms
          multiplier: 1

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  short-link:
    public-base-url: ${SHORT_LINK_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt:
      issuer: https://short-link.local
      access-token-ttl: 15m
      refresh-token-ttl: 30d
