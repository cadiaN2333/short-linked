spring:
  application:
    name: short-link
  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: 初始数据库基线
    validate-on-migrate: true
    clean-disabled: true

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 3000ms
          multiplier: 1

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  short-link:
    public-base-url: ${SHORT_LINK_PUBLIC_BASE_URL:http://localhost:8080}
    bloom:
      # 完成短码比较规则核实前保持关闭；开启后仍须完整初始化成功。
      enabled: false
      expected-insertions: 1000000
      false-positive-probability: 0.001
      load-batch-size: 1000
  security:
    jwt:
      issuer: https://short-link.local
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    login-rate-limit:
      account-failure-limit: 5
      source-failure-limit: 20
      failure-window: 15m
